[project]
name = "nyc-landlord-research-kg"
version = "0.1.0"
description = "Ontology-first knowledge graph course and capstone: an NYC landlord research agent on Neo4j, LangGraph and Deep Agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langsmith[pytest]>=0.14.12",
    "neo4j>=6.4.1",
    "python-dotenv>=1.2.4",
    "rdflib>=7.6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "shacl2cypher>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["agent: calls a model and needs ANTHROPIC_API_KEY", "geosupport: needs the Geosupport sidecar"]
